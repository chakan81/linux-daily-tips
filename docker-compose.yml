
services:
  # PostgreSQL 18 - Primary Database
  postgres:
    image: postgres:18-alpine
    container_name: linux_tips_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: linux_daily_tips
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - linux_tips_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linux_daily_tips"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis 8 - Cache and Session Storage
  redis:
    image: redis:8-alpine
    container_name: linux_tips_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - linux_tips_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # FastAPI Backend (Development mode)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: linux_tips_backend
    restart: unless-stopped
    environment:
      # Database Configuration
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_dev_password@postgres:5432/linux_daily_tips
      POSTGRES_DB: linux_daily_tips
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # Redis Configuration
      REDIS_URL: redis://:redis_dev_password@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: redis_dev_password
      # FastAPI Configuration
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      # Security Configuration
      SECRET_KEY: dev-secret-key-change-in-production-min-32-chars-long-12345678
      JWT_SECRET_KEY: dev-jwt-secret-key-change-in-production-min-32-chars-long
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      # Admin Configuration
      ADMIN_EMAIL: admin@linuxtips.dev
      ADMIN_PASSWORD: admin_dev_password_change_in_production
      ADMIN_USERNAME: admin
      # Google OAuth 2.0 Configuration
      GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "your-google-client-secret"
      GOOGLE_REDIRECT_URI: "http://localhost:8000/api/v1/auth/callback"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker: 호스트 Docker 소켓 마운트
    networks:
      - linux_tips_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__
            - .pytest_cache
            - "*.pyc"

# Persistent volumes for data
volumes:
  postgres_data:
    name: linux_tips_postgres_data
    driver: local
  redis_data:
    name: linux_tips_redis_data
    driver: local

# Development network
networks:
  linux_tips_network:
    name: linux_tips_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16